<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Página Não Encontrada</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0d0d0d;
      color: #ffffff;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 2rem;
      background: rgba(13, 13, 13, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      backdrop-filter: blur(8px);
      max-width: 480px;
      width: 90%;
    }

    .error-code {
      font-size: 6rem;
      font-weight: 800;
      color: #ff2a2a;
      line-height: 1;
      letter-spacing: -2px;
      text-shadow: 0 0 20px rgba(255, 42, 42, 0.3);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 1rem 0 0.5rem 0;
      color: #ffffff;
    }

    p {
      color: #a0a0a0;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 2rem;
    }

    .btn {
      display: inline-block;
      padding: 0.8rem 1.8rem;
      background-color: #ff2a2a;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      border-radius: 30px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(255, 42, 42, 0.2);
    }

    .btn:hover {
      background-color: #ffffff;
      color: #0d0d0d;
      box-shadow: 0 4px 20px rgba(255, 255, 255, 0.4);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <div class="container">
    <div class="error-code">404</div>
    <h1>Página Não Encontrada</h1>
    <p>O conteúdo que você procura sumiu ou nunca existiu. Mova o mouse para interagir com o ambiente enquanto decide o próximo passo.</p>
    <a href="/" class="btn">Voltar ao Início</a>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width = canvas.width = window.innerWidth;
    let height = canvas.height = window.innerHeight;

    const mouse = {
      x: width / 2,
      y: height / 2,
      radius: 120
    };

    window.addEventListener('resize', () => {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    });

    window.addEventListener('mousemove', (e) => {
      mouse.x = e.clientX;
      mouse.y = e.clientY;
    });

    // Classe das Bolinhas
    class Particle {
      constructor() {
        this.x = Math.random() * width;
        this.y = Math.random() * height;
        this.radius = Math.random() * 4 + 1.5;
        this.baseRadius = this.radius;
        this.vx = (Math.random() - 0.5) * 0.6;
        this.vy = (Math.random() - 0.5) * 0.6;
        
        // Alterna entre vermelho e tons de branco/cinza
        const colors = [
          'rgba(255, 42, 42, 0.7)',  // Vermelho
          'rgba(255, 255, 255, 0.6)', // Branco
          'rgba(200, 200, 200, 0.3)'  // Cinza suave
        ];
        this.color = colors[Math.floor(Math.random() * colors.length)];
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.fill();
      }

      update() {
        // Movimento suave padrão
        this.x += this.vx;
        this.y += this.vy;

        // Rebate nas bordas
        if (this.x < 0 || this.x > width) this.vx *= -1;
        if (this.y < 0 || this.y > height) this.vy *= -1;

        // Interação com o Mouse
        const dx = mouse.x - this.x;
        const dy = mouse.y - this.y;
        const distance = Math.sqrt(dx * dx + dy * dy);

        if (distance < mouse.radius) {
          const force = (mouse.radius - distance) / mouse.radius;
          const angle = Math.atan2(dy, dx);
          
          // Afasta levemente as bolinhas e aumenta de tamanho
          this.x -= Math.cos(angle) * force * 2;
          this.y -= Math.sin(angle) * force * 2;
          this.radius = this.baseRadius + force * 4;
        } else {
          if (this.radius > this.baseRadius) {
            this.radius -= 0.1;
          }
        }

        this.draw();
      }
    }

    // Inicializa partículas
    const particles = [];
    const particleCount = Math.floor((width * height) / 9000); // Quantidade adaptável à tela

    for (let i = 0; i < particleCount; i++) {
      particles.push(new Particle());
    }

    // Loop de Animação
    function animate() {
      ctx.clearRect(0, 0, width, height);
      particles.forEach(particle => particle.update());
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
